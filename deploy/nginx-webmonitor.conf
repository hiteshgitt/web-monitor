# Nginx site for webmonitor.ruyalab.com (behind Cloudflare, SSL mode "Full (strict)").
# Install:  sudo cp deploy/nginx-webmonitor.conf /etc/nginx/sites-available/webmonitor
#           sudo ln -s /etc/nginx/sites-available/webmonitor /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

# Plain HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name webmonitor.ruyalab.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webmonitor.ruyalab.com;

    # Cloudflare Origin Certificate (SSL/TLS -> Origin Server -> Create certificate)
    ssl_certificate     /etc/ssl/cloudflare/webmonitor.pem;
    ssl_certificate_key /etc/ssl/cloudflare/webmonitor.key;

    # Built website + dashboard (npm run build)
    root /var/www/webmonitor/dist;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API -> Node backend (PM2 "webmonitor-api")
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Advanced view / AI insights can take ~20 seconds
        proxy_read_timeout 120s;
    }

    # Hashed build files never change: cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Single-page app: /app, /login, /privacy ... all load index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
